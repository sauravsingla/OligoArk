name: Publication experiments

on:
  push:
    branches:
      - "feat/v0.6-indel-generalization"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        payload-size: [512, 2048, 8192]
        scenario:
          - clean
          - substitution-1pct
          - indel-low
          - indel-moderate
          - indel-moderate-highcoverage
          - dropout-2pct
          - dropout-10pct
          - mixed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip
      - run: pip install -e ".[bench]"
      - name: Run publication shard
        run: |
          python benchmarks/run_experiments.py \
            --profile publication \
            --payload-size ${{ matrix.payload-size }} \
            --scenario ${{ matrix.scenario }} \
            --output-dir publication-${{ matrix.payload-size }}-${{ matrix.scenario }}
      - name: Upload publication shard
        uses: actions/upload-artifact@v4
        with:
          name: oligoark-publication-${{ matrix.payload-size }}-${{ matrix.scenario }}
          path: publication-${{ matrix.payload-size }}-${{ matrix.scenario }}/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip
      - run: pip install -e ".[bench]"
      - name: Download publication shards
        uses: actions/download-artifact@v4
        with:
          pattern: oligoark-publication-*
          path: publication-shards
      - name: Aggregate untouched held-out experiment shards
        run: python benchmarks/aggregate_experiment_shards.py
      - name: Evaluate learned policies on unseen seeds and regimes
        run: |
          python benchmarks/run_learning_evaluation.py \
            --experiment-dir publication-results \
            --output-dir learning-results
      - name: Run controlled graph rescue validation
        run: python benchmarks/run_graph_rescue.py
      - name: Validate publication artifacts
        run: |
          test -s publication-results/raw.json
          test -s publication-results/raw.csv
          test -s publication-results/summary.json
          test -s publication-results/summary.csv
          test -s publication-results/paired-effects.json
          test -s publication-results/paired-effects.csv
          test -s publication-results/calibration.json
          test -s publication-results/calibration-candidates.csv
          test -s publication-results/metadata.json
          test -s publication-results/recovery_vs_error_rate.png
          test -s publication-results/overhead_vs_recovery.png
          test -s publication-results/runtime_vs_recovery.png
          test -s publication-results/strategy_ablation.png
          test -s publication-results/graph_rescue_rate.png
          test -s publication-results/optimizer_generalization.png
          test -s learning-results/evaluation.json
          test -s learning-results/summary.csv
          test -s learning-results/linear-model.json
          test -s learning-results/kernel-model.json
          test -s graph-rescue-results.json
      - name: Upload publication validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: oligoark-publication-validation
          path: |
            publication-results/
            learning-results/
            graph-rescue-results.json
          if-no-files-found: error
          retention-days: 90
