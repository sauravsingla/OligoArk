name: Storage scale acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: "Scale benchmark profile"
        required: true
        default: acceptance
        type: choice
        options:
          - acceptance
          - full
  schedule:
    - cron: "23 2 * * 0"

permissions:
  contents: read

jobs:
  storage-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip
      - run: pip install -e ".[bench]"
      - name: Run scale benchmark
        env:
          PROFILE: ${{ github.event.inputs.profile || 'acceptance' }}
        run: python benchmarks/run_storage_scale.py --profile "$PROFILE"
      - name: Enforce 100 MiB milestone for acceptance runs
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event.inputs.profile == 'acceptance' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("storage-scale-results/summary.json").read_text())
          if not summary["milestone_achieved"]:
              raise SystemExit(summary["milestone_failure"])
          print(summary["milestone_statement"])
          PY
      - name: Upload acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: storage-scale-${{ github.run_id }}
          path: |
            storage-scale-results/*.json
            storage-scale-results/*.csv
            storage-scale-results/*.png
          if-no-files-found: error
