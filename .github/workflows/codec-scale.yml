name: Matched storage codec comparison

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Codec benchmark profile"
        required: true
        default: full
        type: choice
        options:
          - ci
          - full
          - scale
      trials:
        description: "Trials per method/condition"
        required: true
        default: "5"
  schedule:
    - cron: "41 3 1 * *"

permissions:
  contents: read

jobs:
  codec-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip
      - run: pip install -e ".[bench]"
      - name: Run matched codec benchmark
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PROFILE: ${{ github.event.inputs.profile }}
          REQUESTED_TRIALS: ${{ github.event.inputs.trials }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            PROFILE=full
            TRIALS=5
          else
            PROFILE="${REQUESTED_PROFILE:-full}"
            TRIALS="${REQUESTED_TRIALS:-5}"
          fi
          python benchmarks/run_dna_fountain_baseline.py             --profile "$PROFILE"             --trials "$TRIALS"             --timeout-seconds 900
      - uses: actions/upload-artifact@v4
        with:
          name: matched-codecs-${{ github.run_id }}
          path: |
            matched-codec-results/*.json
            matched-codec-results/*.csv
            matched-codec-results/*.png
          if-no-files-found: error
