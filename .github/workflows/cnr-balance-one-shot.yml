name: CNR homopolymer-balance one-shot

on:
  push:
    branches:
      - research/cnr-stability-fusion-v06
    paths:
      - ".github/workflows/cnr-balance-one-shot.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out OligoArk
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install and run focused reconstruction tests
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          python -m pytest tests/test_reconstruct.py -q

      - name: Check out pinned Microsoft CNR dataset
        uses: actions/checkout@v4
        with:
          repository: microsoft/clustered-nanopore-reads-dataset
          ref: 6938f44796185902a08381943c2895782886c5c3
          path: .external/cnr
          fetch-depth: 1

      - name: Verify CNR provenance
        run: |
          test "$(git -C .external/cnr rev-parse HEAD)" = \
            "6938f44796185902a08381943c2895782886c5c3"
          test "$(git -C .external/cnr hash-object Centers.txt)" = \
            "2d72f78cd86f2172578aaae297113a4baa14975c"
          test "$(git -C .external/cnr hash-object Clusters.txt)" = \
            "95a71c77cb82f6d501d6aa99c7415591565c5ae3"

      - name: Run lean frozen held-out retry
        run: |
          python - <<'PY'
          import csv
          import json
          import sys
          from pathlib import Path

          from benchmarks.run_external_cnr_benchmark import (
              _records_for_coverage,
              _timed_subprocess,
              load_centers,
              load_clusters,
              mcnemar_exact,
              select_subset,
              summarize_rows,
          )

          output = Path("cnr-balance-held-out")
          output.mkdir(exist_ok=True)
          timing = output / "timing"
          timing.mkdir(exist_ok=True)

          centers = load_centers(Path(".external/cnr/Centers.txt"))
          clusters = load_clusters(
              Path(".external/cnr/Clusters.txt"),
              expected_count=len(centers),
          )
          selected = select_subset(
              centers,
              clusters,
              subset_size=96,
              max_coverage=10,
              seed=20261005,
          )

          script = str(Path("benchmarks/run_external_cnr_benchmark.py").resolve())
          methods = ("confidence_fusion", "homopolymer_balance")
          coverages = (1, 5, 10)
          summaries = []
          all_rows = []

          for coverage in coverages:
              subset = output / f"subset-coverage-{coverage}.json"
              subset.write_text(
                  json.dumps({
                      "coverage": coverage,
                      "records": _records_for_coverage(selected, coverage),
                  }),
                  encoding="utf-8",
              )
              for method in methods:
                  raw = output / f"raw-{method}-coverage-{coverage}.json"
                  elapsed, peak_rss = _timed_subprocess(
                      [
                          sys.executable,
                          script,
                          "--worker-method",
                          method,
                          "--subset-json",
                          str(subset),
                          "--worker-output",
                          str(raw),
                      ],
                      timing / f"{method}-coverage-{coverage}.txt",
                  )
                  rows = json.loads(raw.read_text(encoding="utf-8"))
                  all_rows.extend(rows)
                  summaries.append(summarize_rows(rows, elapsed, peak_rss))

          paired = []
          for coverage in coverages:
              balance = [
                  row for row in all_rows
                  if row["method"] == "homopolymer_balance"
                  and int(row["coverage"]) == coverage
              ]
              prior = [
                  row for row in all_rows
                  if row["method"] == "confidence_fusion"
                  and int(row["coverage"]) == coverage
              ]
              paired.append({
                  "coverage": coverage,
                  "method": "homopolymer_balance",
                  "baseline": "confidence_fusion",
                  **mcnemar_exact(balance, prior),
              })

          payload = {
              "validation_mode": "lean technical retry after first full job timed out",
              "frozen_before_held_out_retry": True,
              "held_out_seed": 20261005,
              "held_out_size": 96,
              "development_provenance": {
                  "seed": 20261008,
                  "size": 64,
                  "baseline_5": 48,
                  "balance_5": 49,
                  "baseline_10": 61,
                  "balance_10": 62,
                  "ten_read_rescues": 1,
                  "ten_read_regressions": 0,
              },
              "summaries": summaries,
              "paired_vs_confidence_fusion": paired,
              "bbs_reference": {
                  "source_workflow_run": 37456317557,
                  "source_artifact": 11410090111,
                  "same_dataset_commit": "6938f44796185902a08381943c2895782886c5c3",
                  "same_held_out_seed": 20261005,
                  "same_held_out_size": 96,
                  "pinned_bbs_commit": "3e4ab46871929819e4f3e34a831c57cac88bb456",
                  "one_read_successes_range": [1, 2],
                  "five_read_successes_range": [72, 74],
                  "ten_read_successes_all_repeats": 93,
              },
          }
          (output / "summary.json").write_text(
              json.dumps(payload, indent=2),
              encoding="utf-8",
          )
          with (output / "raw-results.csv").open("w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(handle, fieldnames=list(all_rows[0]))
              writer.writeheader()
              writer.writerows(all_rows)
          (output / "raw-results.json").write_text(
              json.dumps(all_rows, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2))
          PY

      - name: Enforce acceptance gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("cnr-balance-held-out/summary.json").read_text())
          summaries = {
              (row["method"], int(row["coverage"])): row
              for row in data["summaries"]
          }
          prior_5 = summaries[("confidence_fusion", 5)]
          prior_10 = summaries[("confidence_fusion", 10)]
          balance_5 = summaries[("homopolymer_balance", 5)]
          balance_10 = summaries[("homopolymer_balance", 10)]

          print("prior_5", prior_5)
          print("prior_10", prior_10)
          print("balance_5", balance_5)
          print("balance_10", balance_10)

          assert int(prior_5["successes"]) == 73
          assert int(prior_10["successes"]) == 93
          assert int(balance_10["successes"]) > 93
          assert int(balance_5["successes"]) >= 73
          PY

      - name: Upload authoritative one-shot artifact
        uses: actions/upload-artifact@v4
        with:
          name: cnr-homopolymer-balance-one-shot
          path: cnr-balance-held-out/
          if-no-files-found: error
          retention-days: 90
