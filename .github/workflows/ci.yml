name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev,api]"
      - run: pytest --cov=oligoark --cov-report=term-missing
      - run: ruff check .
      - run: mypy src/oligoark
      - run: python examples/end_to_end.py
      - run: python -m build
