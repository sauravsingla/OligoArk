name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev,api]"
      - run: pytest --cov=oligoark --cov-report=term-missing
      - run: python examples/end_to_end.py
      - run: python -m pip check

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev,api,bench]"
      - run: ruff check .
      - run: mypy src/oligoark
      - run: python -m build
      - run: python -m compileall -q src tests examples benchmarks
      - name: Run all examples
        run: |
          for example in examples/*.py; do
            python "$example"
          done
      - name: Run reproducible benchmark
        run: |
          python benchmarks/run_benchmark.py
          test -s benchmark-results/results.json
          test -s benchmark-results/results.csv
          test -s benchmark-results/metadata.json
          test -s benchmark-results/recovery_by_regime.png
          test -s benchmark-results/overhead_by_regime.png
      - name: Run ablation smoke experiment
        run: |
          python benchmarks/run_experiments.py --profile smoke
          test -s experiment-results/raw.json
          test -s experiment-results/raw.csv
          test -s experiment-results/summary.json
          test -s experiment-results/summary.csv
          test -s experiment-results/metadata.json
          test -s experiment-results/experiment_recovery.png
          test -s experiment-results/experiment_overhead.png
      - name: Run verified adaptive corruption demo
        run: |
          python benchmarks/run_verified_demo.py
          test -s verified-demo-results.json
      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oligoark-research-results
          path: |
            benchmark-results/
            experiment-results/
            verified-demo-results.json
          if-no-files-found: error
      - name: Build Docker image
        run: docker build -t oligoark:ci .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip
      - run: pip install -e ".[api,security]"
      - name: Bandit source scan
        run: bandit -c pyproject.toml -r src/oligoark -q
      - name: Dependency audit
        run: pip-audit --local --skip-editable
