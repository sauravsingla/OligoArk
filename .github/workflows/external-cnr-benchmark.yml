name: External CNR benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "benchmarks/run_external_cnr_benchmark.py"
      - ".github/workflows/external-cnr-benchmark.yml"
      - "src/oligoark/reconstruct.py"

permissions:
  contents: read

concurrency:
  group: external-cnr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out OligoArk
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install OligoArk
        run: |
          python -m pip install -U pip
          pip install -e .

      - name: Check out pinned Microsoft CNR dataset
        uses: actions/checkout@v4
        with:
          repository: microsoft/clustered-nanopore-reads-dataset
          ref: 6938f44796185902a08381943c2895782886c5c3
          path: .external/cnr
          fetch-depth: 1

      - name: Verify CNR provenance and Git blob checksums
        run: |
          test "$(git -C .external/cnr rev-parse HEAD)" = \
            "6938f44796185902a08381943c2895782886c5c3"
          test "$(git -C .external/cnr hash-object Centers.txt)" = \
            "2d72f78cd86f2172578aaae297113a4baa14975c"
          test "$(git -C .external/cnr hash-object Clusters.txt)" = \
            "95a71c77cb82f6d501d6aa99c7415591565c5ae3"
          test "$(sha256sum .external/cnr/Centers.txt | cut -d' ' -f1)" = \
            "b70e723ef0d83a88f7b3e483b932b0279628a0eae39cb4e41d99b9e367c5341e"
          test "$(sha256sum .external/cnr/Clusters.txt | cut -d' ' -f1)" = \
            "7c2e27b497762ed3bb01a2d27ed09ca2291d590a0a7534a25307876d76b6ca22"
          sha256sum .external/cnr/Centers.txt .external/cnr/Clusters.txt

      - name: Run calibration-only CNR research
        run: |
          python benchmarks/run_external_cnr_benchmark.py \
            --centers .external/cnr/Centers.txt \
            --clusters .external/cnr/Clusters.txt \
            --subset-size 96 \
            --coverages 1 5 10 \
            --seed 20261005 \
            --calibration-size 48 \
            --calibration-seed 20261006 \
            --calibration-only \
            --output-dir external-cnr-results

      - name: Validate calibration outputs
        run: |
          test -s external-cnr-results/calibration.json
          test -s external-cnr-results/calibration-clusters.json
          test -s external-cnr-results/calibration-baseline-cases.csv
          test -s external-cnr-results/calibration-winner-cases.csv
          test -s external-cnr-results/calibration-only-summary.json
          python -m json.tool external-cnr-results/calibration-only-summary.json > /dev/null

      - name: Show calibration failure analysis
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("external-cnr-results/calibration-only-summary.json").read_text()
          )
          print("baseline", data["baseline"])
          print("winner", data["winner"])
          print("failure_analysis", data["failure_analysis"])
          PY

      - name: Upload external benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oligoark-cnr-bbs-benchmark
          path: external-cnr-results/
          if-no-files-found: error
          retention-days: 90
