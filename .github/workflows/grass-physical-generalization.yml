name: Grass physical generalization

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grass-physical-generalization
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out OligoArk
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install and run focused tests
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          python -m pytest tests/test_external_grass_benchmark.py tests/test_reconstruct.py -q

      - name: Cache Grass dataset
        id: grass-cache
        uses: actions/cache@v4
        with:
          path: .external/Grass.txt
          key: grass-zenodo-14296588-b076770ad26e955ff60b94e6344e3a05

      - name: Download pinned Grass binned physical dataset
        if: steps.grass-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .external
          curl -L --fail --retry 5 --retry-all-errors \
            --silent --show-error \
            "https://zenodo.org/records/14296588/files/Grass.txt?download=1" \
            -o .external/Grass.txt

      - name: Verify Grass dataset provenance
        run: |
          test -s .external/Grass.txt
          test "$(md5sum .external/Grass.txt | cut -d' ' -f1)" = \
            "b076770ad26e955ff60b94e6344e3a05"
          sha256sum .external/Grass.txt

      - name: Check out pinned BBS baseline
        uses: actions/checkout@v4
        with:
          repository: GZHoffie/bbs
          ref: 3e4ab46871929819e4f3e34a831c57cac88bb456
          path: .external/bbs
          fetch-depth: 1

      - name: Pin Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          rustc --version
          cargo --version

      - name: Cache BBS build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .external/bbs/target
          key: ${{ runner.os }}-bbs-3e4ab468-rust-1.85.1

      - name: Build pinned BBS
        run: |
          test "$(git -C .external/bbs rev-parse HEAD)" = \
            "3e4ab46871929819e4f3e34a831c57cac88bb456"
          cargo build \
            --manifest-path .external/bbs/Cargo.toml \
            --release \
            --locked

      - name: Run independent Grass benchmark
        run: |
          python benchmarks/run_external_grass_benchmark.py \
            --dataset .external/Grass.txt \
            --bbs-bin .external/bbs/target/release/bbs \
            --development-size 48 \
            --held-out-size 96 \
            --development-seed 20261011 \
            --held-out-seed 20261012 \
            --bbs-repeats 5 \
            --output-dir external-grass-results

      - name: Show concise result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("external-grass-results/summary.json").read_text())
          print("dataset", data["metadata"]["dataset"])
          print("development", data["development_diagnostic_only"])
          for row in data["held_out_summaries"]:
              print(
                  row["method"],
                  "coverage=", row["coverage"],
                  "exact=", f'{row["successes"]}/{row["trials"]}',
                  "rate=", row["exact_recovery_rate"],
                  "mean_ed=", row["mean_edit_distance"],
                  "seconds=", row["elapsed_seconds"],
                  "rss_mb=", row["peak_rss_mb"],
              )
          print("paired", data["paired_exact_recovery_vs_first_bbs_repeat"])
          print("BBS repeats", data["bbs_repeat_summaries"])
          PY

      - name: Validate outputs
        run: |
          test -s external-grass-results/summary.json
          test -s external-grass-results/raw-results.json
          test -s external-grass-results/raw-results.csv
          test -s external-grass-results/development-clusters.json
          test -s external-grass-results/held-out-clusters.json
          python -m json.tool external-grass-results/summary.json > /dev/null

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: grass-physical-generalization
          path: external-grass-results/
          if-no-files-found: error
          retention-days: 90
