name: Matched codec completion validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  matched-codecs:
    if: ${{ github.event.pull_request.number == 38 }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip
      - run: pip install -e ".[bench]"
      - name: Run encode-once matched codec comparison
        run: |
          python benchmarks/run_matched_codec_scale.py \
            --profile full \
            --trials 5 \
            --timeout-seconds 1200
      - uses: actions/upload-artifact@v4
        with:
          name: matched-codec-completion-${{ github.run_id }}
          path: matched-codec-results/
          if-no-files-found: error
