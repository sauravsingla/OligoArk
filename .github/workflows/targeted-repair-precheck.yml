name: Targeted repair precheck

on:
  push:
    branches:
      - research/targeted-cnr-repair-v06

permissions:
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev,api]"
      - run: ruff check .
      - run: mypy src/oligoark
      - run: pytest -q tests/test_reconstruct.py
      - run: python -m compileall -q src tests benchmarks
