name: CNR confidence-fusion one-shot

on:
  push:
    branches:
      - research/cnr-confidence-fusion-v06
    paths:
      - ".github/workflows/cnr-fusion-one-shot.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out OligoArk
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install and test focused reconstruction code
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          python -m pytest tests/test_reconstruct.py -q

      - name: Check out pinned Microsoft CNR dataset
        uses: actions/checkout@v4
        with:
          repository: microsoft/clustered-nanopore-reads-dataset
          ref: 6938f44796185902a08381943c2895782886c5c3
          path: .external/cnr
          fetch-depth: 1

      - name: Verify CNR provenance
        run: |
          test "$(git -C .external/cnr rev-parse HEAD)" = \
            "6938f44796185902a08381943c2895782886c5c3"
          test "$(git -C .external/cnr hash-object Centers.txt)" = \
            "2d72f78cd86f2172578aaae297113a4baa14975c"
          test "$(git -C .external/cnr hash-object Clusters.txt)" = \
            "95a71c77cb82f6d501d6aa99c7415591565c5ae3"
          test "$(sha256sum .external/cnr/Centers.txt | cut -d' ' -f1)" = \
            "b70e723ef0d83a88f7b3e483b932b0279628a0eae39cb4e41d99b9e367c5341e"
          test "$(sha256sum .external/cnr/Clusters.txt | cut -d' ' -f1)" = \
            "7c2e27b497762ed3bb01a2d27ed09ca2291d590a0a7534a25307876d76b6ca22"

      - name: Check out pinned BBS baseline
        uses: actions/checkout@v4
        with:
          repository: GZHoffie/bbs
          ref: 3e4ab46871929819e4f3e34a831c57cac88bb456
          path: .external/bbs
          fetch-depth: 1

      - name: Build pinned BBS
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          test "$(git -C .external/bbs rev-parse HEAD)" = \
            "3e4ab46871929819e4f3e34a831c57cac88bb456"
          cargo build \
            --manifest-path .external/bbs/Cargo.toml \
            --release \
            --locked

      - name: Run one-shot frozen held-out benchmark
        run: |
          python benchmarks/run_external_cnr_benchmark.py \
            --centers .external/cnr/Centers.txt \
            --clusters .external/cnr/Clusters.txt \
            --bbs-bin .external/bbs/target/release/bbs \
            --subset-size 96 \
            --coverages 1 5 10 \
            --seed 20261005 \
            --calibration-size 48 \
            --calibration-seed 20261006 \
            --bbs-repeats 5 \
            --output-dir cnr-fusion-held-out

      - name: Enforce held-out acceptance gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("cnr-fusion-held-out/summary.json").read_text())
          summaries = {
              (row["method"], int(row["coverage"])): row
              for row in data["summaries"]
          }
          targeted_5 = summaries[("targeted_trace", 5)]
          targeted_10 = summaries[("targeted_trace", 10)]
          fusion_5 = summaries[("confidence_fusion", 5)]
          fusion_10 = summaries[("confidence_fusion", 10)]
          bbs_5 = summaries[("external_bbs", 5)]
          bbs_10 = summaries[("external_bbs", 10)]

          print("targeted_5", targeted_5)
          print("targeted_10", targeted_10)
          print("fusion_5", fusion_5)
          print("fusion_10", fusion_10)
          print("bbs_5", bbs_5)
          print("bbs_10", bbs_10)

          assert int(targeted_5["successes"]) == 68
          assert int(targeted_10["successes"]) == 84
          assert int(fusion_10["successes"]) > 84
          assert int(fusion_5["successes"]) >= 68
          PY

      - name: Upload authoritative one-shot artifact
        uses: actions/upload-artifact@v4
        with:
          name: cnr-confidence-fusion-one-shot
          path: cnr-fusion-held-out/
          if-no-files-found: error
          retention-days: 90
