name: Codec 100 MiB research validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/codec-100mib-research.yml"
      - "benchmarks/100mib-research-trigger.txt"

concurrency:
  group: codec-100mib-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matched-100mib:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        method:
          - oligoark-compact-hybrid
          - oligoark-compact-v3-hybrid
          - dna-fountain-cleanroom
          - goldman-rotating-xor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip
      - run: pip install -e ".[bench]"
      - name: Run matched 100 MiB benchmark
        env:
          METHOD: ${{ matrix.method }}
        run: |
          OUT="matched-codec-100mib/${METHOD}"
          python benchmarks/run_matched_codec_scale.py \
            --profile research-100 \
            --method "${METHOD}" \
            --trials 10 \
            --condition-timeout-seconds 300 \
            --timeout-seconds 1800 \
            --output "${OUT}"
          test -s "${OUT}/results.json"
          test -s "${OUT}/trial-results.json"
          test -s "${OUT}/metadata.json"
          test -s "${OUT}/summary.json"
      - name: Validate retained trial accounting
        if: always()
        env:
          METHOD: ${{ matrix.method }}
        run: |
          OUT="matched-codec-100mib/${METHOD}"
          python - "${OUT}/results.json" "${OUT}/metadata.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          results_path = Path(sys.argv[1])
          metadata_path = Path(sys.argv[2])
          if not results_path.exists() or not metadata_path.exists():
              raise SystemExit("benchmark did not produce required evidence files")

          rows = json.loads(results_path.read_text())
          metadata = json.loads(metadata_path.read_text())
          conditions = list(metadata["conditions"])
          expected_trials = int(metadata["trials_per_condition"])
          if len(rows) != len(conditions):
              raise SystemExit(
                  f"expected {len(conditions)} condition rows, found {len(rows)}"
              )
          by_condition = {row["condition"]: row for row in rows}
          if sorted(by_condition) != sorted(conditions):
              raise SystemExit("condition rows are incomplete")
          for condition in conditions:
              row = by_condition[condition]
              trials = int(row["trials"])
              trial_results = list(row.get("trial_results", []))
              if trials != expected_trials or len(trial_results) != trials:
                  raise SystemExit(
                      f"{condition}: requested {expected_trials} trials but retained "
                      f"{len(trial_results)}"
                  )
              observed = sorted(int(item["trial"]) for item in trial_results)
              if observed != list(range(trials)):
                  raise SystemExit(f"{condition}: missing or duplicated trial indexes")
          print("all requested 100 MiB trials retained, including negative results/timeouts")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matched-codec-100mib-${{ matrix.method }}-${{ github.run_id }}
          path: matched-codec-100mib/
          if-no-files-found: error
          retention-days: 90
