name: Codec 100 MiB research validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/codec-100mib-research.yml"
      - "benchmarks/100mib-research-trigger.txt"

# Large runs are expensive: a subsequent commit must not cancel an active
# benchmark or destroy its incomplete but scientifically important results.
# Group by commit so a validated new run can start while an older run finishes.
concurrency:
  group: codec-100mib-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  matched-100mib:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        method:
          - oligoark-compact-hybrid
          - oligoark-compact-v3-hybrid
          - dna-fountain-cleanroom
          - goldman-rotating-xor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip
      - run: pip install -e ".[bench]"
      # Leave time for always-run evidence checks and artifact upload if the
      # benchmark stalls; the failed benchmark step remains a failed job.
      - name: Run matched 100 MiB benchmark
        timeout-minutes: ${{ matrix.method == 'dna-fountain-cleanroom' && 55 || 330 }}
        env:
          METHOD: ${{ matrix.method }}
        run: |
          OUT="matched-codec-100mib/${METHOD}"
          mkdir -p "${OUT}"
          CMD=(python benchmarks/run_matched_codec_scale.py
            --profile research-100
            --method "${METHOD}"
            --trials 10
            --condition-timeout-seconds 300
            --timeout-seconds 1800
            --output "${OUT}")
          if [ "${METHOD}" = "dna-fountain-cleanroom" ]; then
            # The previous 90-minute step lost its runner at ~71 minutes, before
            # always() could upload artifacts. Stop the process earlier, while
            # retaining an explicit FAILED run and measured peak process RSS.
            started=$(date +%s)
            set +e
            /usr/bin/time -v -o "${OUT}/resource-usage.txt" \
              timeout --signal=TERM --kill-after=30s 2400s "${CMD[@]}"
            status=$?
            set -e
            if [ "${status}" -ne 0 ]; then
              STATUS="${status}" ELAPSED="$(( $(date +%s) - started ))" OUT="${OUT}" \
                python - <<'PY'
          import json
          import os
          from pathlib import Path

          status = int(os.environ["STATUS"])
          diagnostic = {
              "method": "dna-fountain-cleanroom",
              "size_bytes": 100 * 1024 * 1024,
              "status": "incomplete",
              "exit_code": status,
              "possible_watchdog_timeout": status == 124,
              "watchdog_seconds": 2400,
              "elapsed_seconds": int(os.environ["ELAPSED"]),
              "trial_outcomes_verified": False,
              "git_sha": os.environ.get("GITHUB_SHA"),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "note": "Worker ended without complete evidence; do not count unavailable trials as failed recoveries or passes.",
          }
          (Path(os.environ["OUT"]) / "interruption.json").write_text(
              json.dumps(diagnostic, indent=2) + "\n", encoding="utf-8"
          )
          PY
              echo "::error::100 MiB fountain worker incomplete (exit ${status}); diagnostic and resource usage retained"
              exit "${status}"
            fi
          else
            "${CMD[@]}"
          fi
          test -s "${OUT}/results.json"
          test -s "${OUT}/trial-results.json"
          test -s "${OUT}/metadata.json"
          test -s "${OUT}/summary.json"
      - name: Summarize retained timeout evidence
        if: always()
        env:
          METHOD: ${{ matrix.method }}
        run: |
          OUT="matched-codec-100mib/${METHOD}"
          if test -s "${OUT}/results.json"; then
            python benchmarks/summarize_codec_timeouts.py "${OUT}/results.json" --output "${OUT}/timeout-hotspots.json"
          else
            echo "::warning::100 MiB benchmark did not retain results.json; job remains failed if benchmark or validation failed"
          fi
      - name: Validate retained trial accounting
        if: always()
        env:
          METHOD: ${{ matrix.method }}
        run: |
          OUT="matched-codec-100mib/${METHOD}"
          python - "${OUT}/results.json" "${OUT}/metadata.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          results_path = Path(sys.argv[1])
          metadata_path = Path(sys.argv[2])
          if not results_path.exists() or not metadata_path.exists():
              raise SystemExit("benchmark did not produce required evidence files")

          rows = json.loads(results_path.read_text())
          metadata = json.loads(metadata_path.read_text())
          conditions = list(metadata["conditions"])
          expected_trials = int(metadata["trials_per_condition"])
          if len(rows) != len(conditions):
              raise SystemExit(
                  f"expected {len(conditions)} condition rows, found {len(rows)}"
              )
          by_condition = {row["condition"]: row for row in rows}
          if sorted(by_condition) != sorted(conditions):
              raise SystemExit("condition rows are incomplete")
          for condition in conditions:
              row = by_condition[condition]
              trials = int(row["trials"])
              trial_results = list(row.get("trial_results", []))
              if trials != expected_trials or len(trial_results) != trials:
                  raise SystemExit(
                      f"{condition}: requested {expected_trials} trials but retained "
                      f"{len(trial_results)}"
                  )
              observed = sorted(int(item["trial"]) for item in trial_results)
              if observed != list(range(trials)):
                  raise SystemExit(f"{condition}: missing or duplicated trial indexes")
              # Genuine unsuccessful recoveries and per-trial timeouts are
              # valid negative benchmark evidence. Missing worker outcomes are
              # not completed experiments, even if placeholder rows exist.
              unavailable = [
                  item for item in trial_results
                  if item.get("outcome_unavailable") or item.get("not_executed")
              ]
              if unavailable:
                  raise SystemExit(
                      f"{condition}: {len(unavailable)}/{trials} unverified worker "
                      "outcomes; retain artifacts but do not mark validation complete"
                  )
              if any(
                  not isinstance(item.get("sha256_verified"), bool)
                  for item in trial_results
              ):
                  raise SystemExit(f"{condition}: missing SHA-256 trial verdict")
          print("all requested 100 MiB trials have verified outcomes, including failures/timeouts")
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: matched-codec-100mib-${{ matrix.method }}-${{ github.run_id }}
          path: matched-codec-100mib/
          if-no-files-found: error
          retention-days: 90
