[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "oligoark"
version = "0.5.0"
description = "AI-native DNA archival storage research framework for held-out adaptive optimisation, graph-rescue validation, policy learning, and explainable lifecycle intelligence."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Saurav Singla"}]
keywords = [
  "dna-storage",
  "archival-storage",
  "error-correction",
  "bioinformatics",
  "storage-tiering",
  "graph-ai",
  "adaptive-coding",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
bench = ["matplotlib>=3.8"]
security = ["bandit>=1.7", "pip-audit>=2.7"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.7",
  "mypy>=1.11",
  "build>=1.2",
  "fastapi>=0.115",
  "httpx>=0.27",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[project.scripts]
oligoark = "oligoark.cli:main"

[project.urls]
Homepage = "https://github.com/sauravsingla/OligoArk"
Repository = "https://github.com/sauravsingla/OligoArk"
Issues = "https://github.com/sauravsingla/OligoArk/issues"
PyPI = "https://pypi.org/project/oligoark/"

[tool.hatch.build.targets.wheel]
packages = ["src/oligoark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.coverage.run]
source = ["oligoark"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B311"]
